<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>
        Acompanhamento de Vendas
    </title>

</head>


<body>


    <!-- =========================
         CABEÇALHO
    ========================== -->

    <header class="topo">


        <!-- LOGO -->

        <div class="logo">

            <img
                src="static/logo.png"
                alt="DTEL Telecom"
            >

        </div>


        <!-- TÍTULO -->

        <div class="titulo">

            <h1>
                Acompanhamento de Vendas
            </h1>

            <p>
                Visão Geral do Período
            </p>

        </div>


        <!-- =========================
             FILTROS
        ========================== -->

        <div class="filtros-topo">


            <div class="campo-data">

                <label for="data-inicial">
                    Data de Início
                </label>

                <input
                    type="date"
                    id="data-inicial"
                >

            </div>


            <div class="campo-data">

                <label for="data-final">
                    Data de Fim
                </label>

                <input
                    type="date"
                    id="data-final"
                >

            </div>


            <div class="acoes">

                <button
                    class="btn-filtrar"
                    onclick="carregarVendas()"
                >
                    ⚱ Filtrar
                </button>


                <button
                    class="btn-limpar"
                    onclick="limparFiltros()"
                >
                    ◱ Limpar
                </button>

            </div>


        </div>


    </header>


    <!-- =========================
         CONTEÚDO
    ========================== -->

    <main class="container">


        <!-- =========================
             RANKING
        ========================== -->

        <section class="painel ranking">


            <!-- =========================
                 CABEÇALHO DO RANKING
            ========================== -->

            <div class="ranking-cabecalho">


                <!-- TÍTULO -->

                <div class="titulo-painel">

                    <h2>
                        🏆 Ranking de Vendas
                    </h2>

                </div>


                <!-- =========================
                     TOTAL DE VENDAS
                ========================== -->

                <div class="ranking-total">


                    <!-- GRÁFICO CIRCULAR -->

                    <div class="grafico-total">


                        <div class="grafico-total-centro">

                            <strong id="total-vendas">
                                0
                            </strong>

                        </div>


                    </div>


                    <!-- TEXTO -->

                    <div class="ranking-total-info">

                        <span>
                            Total de Vendas
                        </span>

                    </div>


                </div>


            </div>


            <!-- =========================
                 LISTA DE VENDEDORES
            ========================== -->

            <div id="lista-vendedores">

                <!--
                    Preenchido automaticamente
                    pelo JavaScript
                -->

            </div>


        </section>


        <!-- =========================
             VENDAS
        ========================== -->

        <section class="painel desempenho">


            <div class="titulo-painel">

                <h2>
                    Vendas
                </h2>

            </div>


            <!-- =========================
                 PLANOS VENDIDOS
            ========================== -->

            <div class="planos-vendidos">


                <h3>
                    Planos Vendidos
                </h3>


                <div id="lista-planos">

                    <!--
                        Preenchido automaticamente
                        pelo JavaScript
                    -->

                </div>


            </div>


        </section>


        <!-- =========================
             COMISSÕES
        ========================== -->

        <section class="painel comissoes">


            <!-- TÍTULO -->

            <div class="titulo-painel">

                <h2>
                    💰 Comissões
                </h2>

            </div>


            <!-- =========================
                 COMISSÃO DO LÍDER
            ========================== -->

            <div class="comissao-total">


                <div class="icone-comissao">

                    💵

                </div>


                <div class="comissao-total-info">

                    <span>
                        Comissão líder
                    </span>

                    <strong id="comissao-lider">
                        R$ 0,00
                    </strong>

                </div>


            </div>


            <!-- =========================
                 VENDEDORES
            ========================== -->

            <div class="comissao-vendedores">


                <h3>
                    Vendedores
                </h3>


                <!-- JONATAS -->

                <div class="comissao-item">


                    <div class="comissao-vendedor">

                        <span class="comissao-avatar">
                            J
                        </span>

                        <span class="comissao-nome">
                            Jonatas Henrique
                        </span>

                    </div>


                    <strong
                        class="comissao-valor"
                        id="comissao-jonatas"
                    >
                        R$ 0,00
                    </strong>


                </div>


                <!-- KEILA -->

                <div class="comissao-item">


                    <div class="comissao-vendedor">

                        <span class="comissao-avatar">
                            K
                        </span>

                        <span class="comissao-nome">
                            Keila Thais
                        </span>

                    </div>


                    <strong
                        class="comissao-valor"
                        id="comissao-keila"
                    >
                        R$ 0,00
                    </strong>


                </div>


                <!-- LEILANY -->

                <div class="comissao-item">


                    <div class="comissao-vendedor">

                        <span class="comissao-avatar">
                            L
                        </span>

                        <span class="comissao-nome">
                            Leilany Lavinia
                        </span>

                    </div>


                    <strong
                        class="comissao-valor"
                        id="comissao-leilany"
                    >
                        R$ 0,00
                    </strong>


                </div>


                <!-- DENILSON -->

                <div class="comissao-item">


                    <div class="comissao-vendedor">

                        <span class="comissao-avatar">
                            D
                        </span>

                        <span class="comissao-nome">
                            Denilson Soares
                        </span>

                    </div>


                    <strong
                        class="comissao-valor"
                        id="comissao-denilson"
                    >
                        R$ 0,00
                    </strong>


                </div>


            </div>


        </section>


    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script.js"></script>


</body>

</html>
